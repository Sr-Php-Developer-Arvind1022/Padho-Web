<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome to BoloApp</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, sans-serif;">

    <table align="center" width="100%" cellpadding="0" cellspacing="0" style="padding:20px;">
        <tr>
            <td align="center">
                
                <table width="500" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:10px; overflow:hidden;">
                    
                    <!-- Header -->
                    <tr>
                        <td style="background:#4CAF50; color:#ffffff; padding:15px; text-align:center;">
                            <h2 style="margin:0;">Welcome to BoloApp</h2>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding:20px; color:#333;">
                            <p>Hi <b>{{name}}</b>,</p>

                            <p>Your account has been successfully created.</p>

                            <p><b>Email:</b> {{email}}</p>
                            <p><b>Password:</b> {{password}}</p>

                            <p>We are excited to have you onboard!</p>

                            <p>Thank you for choosing BoloApp.</p>

                            <p>Best regards,</p>

                            <p>BoloApp Team</p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:10px; font-size:12px; color:gray; text-align:center;">
                            2026 BoloApp. All rights reserved.
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
